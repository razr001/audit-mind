# 单节点 Loki 配置，适合本地开发和单机私有部署。生产多节点部署应改用
# 官方 Helm 架构和对象存储，而不是共享此本地 filesystem 配置。
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: auditmind_loki_
        period: 24h

limits_config:
  # 本地默认保留 30 天，避免日志无限占用磁盘。
  retention_period: 720h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
