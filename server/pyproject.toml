[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.18.5",
    "anyio>=4.0.0,<5.0.0",
    "asyncpg>=0.31.0",
    "dramatiq[redis,watch]>=2.2.0,<3.0.0",
    "elasticsearch>=9.4.1",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.4",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langdetect>=1.0.9",
    "langextract[openai]>=1.6.0",
    "markdown-it-py>=4.0.0,<5.0.0",
    "minio>=7.2.20",
    "psycopg[binary,pool]>=3.3.4",
    "pypdf>=6.15.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pwdlib[argon2]>=0.3.0,<1.0.0",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "typing-extensions>=4.16.0",
    "uvicorn[standard]>=0.52.1",
    "langgraph-checkpoint-postgres>=3,<4",
]

# First-party providers use the same plugin contract as separately installed
# third-party packages. This entry point is intentionally not hard-coded in the
# registry, so the Bailian implementation doubles as a complete extension example.
[project.entry-points."auditmind.rerankers"]
bailian = "app.plugin.reranking.bailian:create_reranker"

[project.scripts]
auditmind-api = "app.server:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
